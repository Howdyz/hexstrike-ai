<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HexStrike AI &mdash; Control Deck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%A1</text></svg>">
<style>
:root{
  --bg-0:#07090c;
  --bg-1:#0c1015;
  --bg-2:#12171e;
  --bg-3:#1a212b;
  --bg-4:#232b37;
  --line:#232c38;
  --line-soft:#1a212b;
  --text-0:#eef3f8;
  --text-1:#aab6c4;
  --text-2:#6d7a8a;
  --accent:#39ff8f;
  --accent-dim:#1c8a52;
  --accent-glow:rgba(57,255,143,.35);
  --red:#ff4d5e;
  --red-dim:#7a1c26;
  --orange:#ff9f43;
  --blue:#4fc3ff;
  --purple:#b57bff;
  --yellow:#ffd166;
  --mono: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow-1: 0 8px 24px rgba(0,0,0,.35);
  --shadow-glow: 0 0 0 1px var(--accent-glow), 0 0 24px -4px var(--accent-glow);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(57,255,143,.06), transparent 60%),
    radial-gradient(900px 600px at 110% 10%, rgba(255,77,94,.05), transparent 55%),
    var(--bg-0);
  color:var(--text-0);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#04140b;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:8px;border:2px solid var(--bg-0);}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}
a{color:inherit;}
button{font-family:inherit;}

.app{display:grid;grid-template-columns:252px 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden;}

/* ---------- Topbar ---------- */
.topbar{
  grid-column:1/3; grid-row:1;
  display:flex; align-items:center; gap:16px;
  padding:0 18px;
  background:linear-gradient(180deg,var(--bg-1),rgba(12,16,21,.85));
  border-bottom:1px solid var(--line);
  backdrop-filter: blur(10px);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),#0a3d24);
  color:#04140b; font-size:15px; box-shadow:var(--shadow-glow);
}
.brand-name{font-size:15px;}
.brand-name .v{color:var(--text-2);font-weight:500;font-size:11px;margin-left:4px;font-family:var(--mono);}

.search-wrap{flex:1;max-width:520px;position:relative;}
.search-wrap input{
  width:100%; background:var(--bg-2); border:1px solid var(--line);
  color:var(--text-0); padding:9px 12px 9px 34px; border-radius:var(--r-md);
  font-size:13px; outline:none; transition:.15s border-color,.15s box-shadow;
}
.search-wrap input:focus{border-color:var(--accent-dim); box-shadow:0 0 0 3px rgba(57,255,143,.08);}
.search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-2);}
.search-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--text-2);background:var(--bg-3);border:1px solid var(--line);padding:2px 5px;border-radius:4px;}

.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.target-input{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 10px;}
.target-input label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);}
.target-input input{background:transparent;border:none;outline:none;color:var(--accent);font-family:var(--mono);font-size:12.5px;width:150px;}

.conn-badge{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-1);padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-2);cursor:pointer;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-2);box-shadow:0 0 0 3px rgba(255,255,255,.03);}
.dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent-glow),0 0 0 3px rgba(57,255,143,.12);}
.dot.off{background:var(--red);box-shadow:0 0 8px rgba(255,77,94,.4),0 0 0 3px rgba(255,77,94,.12);}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ---------- Sidebar ---------- */
.sidebar{
  grid-column:1; grid-row:2;
  background:var(--bg-1); border-right:1px solid var(--line);
  overflow-y:auto; padding:14px 10px 24px;
}
.nav-group{margin-bottom:4px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--text-1);font-size:13px;font-weight:500;
  transition:.12s background,.12s color; user-select:none;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--bg-2);color:var(--text-0);}
.nav-item.active{background:rgba(57,255,143,.08);color:var(--accent);border-color:rgba(57,255,143,.18);}
.nav-item .ic{width:16px;text-align:center;font-size:13px;opacity:.9;}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-2);background:var(--bg-3);padding:1px 6px;border-radius:20px;}
.nav-item.active .count{color:var(--accent);background:rgba(57,255,143,.12);}
.nav-sep{height:1px;background:var(--line-soft);margin:10px 6px;}
.nav-label{font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px;font-weight:600;}

.subnav{margin-left:8px;padding-left:10px;border-left:1px solid var(--line-soft);display:none;flex-direction:column;gap:1px;margin-bottom:6px;}
.subnav.open{display:flex;}
.subnav .nav-item{font-size:12px;padding:6px 10px;}

/* ---------- Main ---------- */
.main{grid-column:2;grid-row:2;overflow-y:auto;position:relative;}
.view{display:none;padding:22px 26px 60px;max-width:1400px;}
.view.active{display:block;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.01em;}
.page-sub{color:var(--text-2);font-size:12.5px;margin-top:4px;}
.page-actions{display:flex;gap:8px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--bg-2);color:var(--text-0);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.12s all;
}
.btn:hover{background:var(--bg-3);border-color:var(--bg-4);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#0f9e5b);border-color:transparent;color:#04140b;box-shadow:0 4px 14px -4px var(--accent-glow);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{background:linear-gradient(135deg,#ff5b6b,var(--red-dim));border-color:transparent;color:#fff;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:5px 10px;font-size:11.5px;}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px;
  position:relative;overflow:hidden;
}
.stat-card::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at 100% 0%, rgba(57,255,143,.08), transparent 70%);}
.stat-val{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em;}
.stat-val.accent{color:var(--accent);}
.stat-val.red{color:var(--red);}
.stat-label{color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:600;}

.panel{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line-soft);}
.panel-head h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.panel-body{padding:14px 16px;}

/* health grid */
.cat-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.cat-bar{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:10px 12px;}
.cat-bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;}
.cat-bar-top b{font-weight:600;color:var(--text-0);text-transform:capitalize;}
.cat-bar-top span{color:var(--text-2);font-family:var(--mono);}
.bar-track{height:6px;background:var(--bg-4);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:4px;transition:width .5s;}

.tool-chip-grid{display:flex;flex-wrap:wrap;gap:6px;}
.tool-chip{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line-soft);padding:5px 9px;border-radius:20px;font-size:11px;font-family:var(--mono);color:var(--text-1);}
.tool-chip .dot{width:6px;height:6px;}

/* card grid */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.chip-filter{padding:6px 12px;border-radius:20px;background:var(--bg-2);border:1px solid var(--line);font-size:11.5px;color:var(--text-1);cursor:pointer;font-weight:600;}
.chip-filter.active{background:rgba(57,255,143,.1);color:var(--accent);border-color:rgba(57,255,143,.25);}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.tool-card{
  background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 14px 12px;cursor:pointer;transition:.14s transform,.14s border-color,.14s background;
  display:flex;flex-direction:column;gap:8px;
}
.tool-card:hover{border-color:var(--accent-dim);background:var(--bg-2);transform:translateY(-2px);}
.tool-card-top{display:flex;align-items:center;justify-content:space-between;}
.tool-name{font-family:var(--mono);font-weight:700;font-size:13.5px;color:var(--text-0);}
.method-badge{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.03em;}
.method-badge.GET{background:rgba(79,195,255,.14);color:var(--blue);}
.method-badge.POST{background:rgba(57,255,143,.14);color:var(--accent);}
.method-badge.DELETE{background:rgba(255,77,94,.14);color:var(--red);}
.tool-doc{color:var(--text-2);font-size:11.5px;line-height:1.45;flex:1;}
.tool-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
.param-count{font-size:10.5px;color:var(--text-2);font-family:var(--mono);}
.cat-tag{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-2);}
.empty-state .big{font-size:34px;margin-bottom:10px;}

/* process table */
.proc-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.proc-table th{text-align:left;color:var(--text-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);}
.proc-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.proc-table tr:hover td{background:var(--bg-2);}
.proc-cmd{font-family:var(--mono);font-size:11.5px;color:var(--text-1);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.status-pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.status-pill.running{background:rgba(57,255,143,.12);color:var(--accent);}
.status-pill.paused{background:rgba(255,159,67,.14);color:var(--orange);}
.status-pill.completed{background:rgba(79,195,255,.14);color:var(--blue);}
.status-pill.terminated,.status-pill.error{background:rgba(255,77,94,.14);color:var(--red);}
.mini-bar{width:90px;height:5px;background:var(--bg-4);border-radius:3px;overflow:hidden;}
.mini-bar .fill{height:100%;background:var(--accent);}
.row-actions{display:flex;gap:5px;}
.icon-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;}
.icon-btn:hover{border-color:var(--accent-dim);color:var(--accent);}
.icon-btn.stop:hover{border-color:var(--red);color:var(--red);}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(4,6,9,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s opacity;z-index:40;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(560px,100vw);
  background:var(--bg-1);border-left:1px solid var(--line);
  transform:translateX(100%);transition:.24s cubic-bezier(.2,.8,.3,1);
  z-index:50;display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,.4);
}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.drawer-head h2{margin:0 0 4px;font-family:var(--mono);font-size:16px;}
.drawer-head p{margin:0;color:var(--text-2);font-size:12px;}
.drawer-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-1);cursor:pointer;flex-shrink:0;}
.drawer-close:hover{color:var(--red);border-color:var(--red);}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px;}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;}

.field{margin-bottom:14px;}
.field label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-1);margin-bottom:6px;font-family:var(--mono);}
.field label .req{color:var(--red);}
.field label .hint{color:var(--text-2);font-weight:400;font-family:var(--sans);}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--text-0);
  padding:9px 11px;border-radius:var(--r-sm);font-size:12.5px;font-family:var(--mono);outline:none;
}
.field textarea{min-height:70px;resize:vertical;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-dim);box-shadow:0 0 0 3px rgba(57,255,143,.08);}
.field-check{display:flex;align-items:center;gap:9px;}
.switch{position:relative;width:36px;height:20px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--bg-4);border-radius:20px;cursor:pointer;transition:.15s;}
.slider::before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--text-1);border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--accent-dim);}
.switch input:checked + .slider::before{transform:translateX(16px);background:var(--accent);}

.endpoint-line{font-family:var(--mono);font-size:11px;color:var(--text-2);background:var(--bg-2);padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line-soft);margin-bottom:16px;word-break:break-all;}
.endpoint-line b{color:var(--accent);}

.output-box{background:#04070a;border:1px solid var(--line);border-radius:var(--r-md);margin-top:8px;}
.output-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line-soft);}
.output-head span{font-size:10.5px;color:var(--text-2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}
.output-pre{margin:0;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#c9f7dd;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto;}
.output-pre.err{color:#ffb3ba;}
.spin{width:14px;height:14px;border:2px solid var(--bg-4);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* activity */
.log-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.log-item:last-child{border-bottom:none;}
.log-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.log-dot.ok{background:var(--accent);}
.log-dot.fail{background:var(--red);}
.log-main{flex:1;min-width:0;}
.log-top{display:flex;justify-content:space-between;gap:8px;}
.log-path{font-family:var(--mono);font-size:12px;color:var(--text-0);}
.log-time{font-size:10.5px;color:var(--text-2);font-family:var(--mono);white-space:nowrap;}
.log-meta{font-size:11px;color:var(--text-2);margin-top:2px;}

.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100;}
.toast{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:11px 16px;border-radius:var(--r-sm);font-size:12.5px;box-shadow:var(--shadow-1);min-width:220px;animation:slidein .2s ease;}
.toast.err{border-left-color:var(--red);}
@keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* help view */
.cmd-box{display:flex;align-items:center;gap:10px;background:#04070a;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:4px;}
.cmd-box code{flex:1;font-family:var(--mono);font-size:12.5px;color:var(--accent);background:none;white-space:pre;overflow-x:auto;}
.cmd-copy{width:26px;height:26px;flex-shrink:0;border-radius:6px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-1);cursor:pointer;font-size:12px;}
.cmd-copy:hover{border-color:var(--accent-dim);color:var(--accent);}
.cmd-note{flex-shrink:0;font-size:11px;color:var(--text-2);}
.help-step{display:flex;gap:14px;margin-bottom:16px;}
.help-step:last-child{margin-bottom:0;}
.help-step-num{width:26px;height:26px;border-radius:50%;background:rgba(57,255,143,.1);border:1px solid rgba(57,255,143,.25);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;flex-shrink:0;}
.help-step-body{flex:1;min-width:0;}
.help-step-body h4{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--text-0);}
.help-block{margin-bottom:18px;}
.help-block:last-child{margin-bottom:0;}
.help-block h4{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
.help-block p{margin:0;color:var(--text-1);font-size:12.5px;line-height:1.6;}
.help-block ul,.help-block ol{margin:0;padding-left:18px;color:var(--text-1);font-size:12.5px;line-height:1.9;}
.help-block li b{color:var(--text-0);}
.help-block code{font-family:var(--mono);font-size:11.5px;color:var(--accent);background:var(--bg-2);padding:1px 5px;border-radius:4px;}

@media (max-width: 720px){
  .app{grid-template-columns:0 1fr;}
  .sidebar{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-name">HexStrike <span class="v">v6.0 · control deck</span></div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, isErr){
  const t = el('div','toast'+(isErr?' err':''), esc(msg));
  $('#toastStack').appendChild(t);
  setTimeout(()=>{ t.style.transition='.25s'; t.style.opacity='0'; t.style.transform='translateX(20px)'; setTimeout(()=>t.remove(),250); }, 3200);
}

// ---------------- sidebar ----------------
function buildSidebar(){
  const sb = $('#sidebar');
  sb.innerHTML = '';

  sb.appendChild(navItem('Overview', null, GROUP_META.Overview.icon, null));

  const secLabel = el('div','nav-label','Assessment');
  sb.appendChild(secLabel);
  ['AI Intelligence','Vulnerability Intel','Bug Bounty','CTF Toolkit'].forEach(g=>{
    const count = countGroup(g);
    sb.appendChild(navItem(g, null, GROUP_META[g].icon, count));
  });

  sb.appendChild(el('div','nav-label','Arsenal'));
  const toolsCount = countGroup('Security Tools');
  const toolsItem = navItem('Security Tools', null, GROUP_META['Security Tools'].icon, toolsCount, true);
  sb.appendChild(toolsItem);
  const subwrap = el('div','subnav');
  subwrap.id = 'toolsSubnav';
  Object.keys(HEXDATA['Security Tools']||{}).forEach(sub=>{
    const c = HEXDATA['Security Tools'][sub].length;
    subwrap.appendChild(navItem('Security Tools', sub, SUB_ICON[sub]||'•', c));
  });
  sb.appendChild(subwrap);

  sb.appendChild(el('div','nav-label','Operations'));
  ['Process Manager','Visual Reports','System'].forEach(g=>{
    sb.appendChild(navItem(g, null, GROUP_META[g].icon, countGroup(g)));
  });

  sb.appendChild(el('div','nav-sep'));
  sb.appendChild(navItem('Activity', null, GROUP_META.Activity.icon, state.history.length));
  sb.appendChild(navItem('Help', null, GROUP_META.Help.icon, null));
}

function countGroup(g){
  let n = 0;
  for (const sub in (HEXDATA[g]||{})) n += HEXDATA[g][sub].length;
  return n;
}

function navItem(group, sub, icon, count, expandToggle){
  const item = el('div','nav-item');
  item.setAttribute('role','button');
  item.setAttribute('tabindex','0');
  item.setAttribute('aria-label', sub||group);
  item.innerHTML = `<span class="ic">${icon}</span><span>${sub||group}</span>` + (count!=null?`<span class="count">${count}</span>`:'');
  item.dataset.group = group;
  if (sub) item.dataset.sub = sub;
  const activate = ()=>{
    if (expandToggle){
      const sn = $('#toolsSubnav');
      sn.classList.toggle('open');
    }
    setView(group, sub||null);
  };
  item.addEventListener('click', activate);
  item.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activate(); } });
  return item;
}

function refreshSidebarActive(){
  document.querySelectorAll('.nav-item').forEach(it=>{
    const match = it.dataset.group === state.view && (it.dataset.sub||null) === state.sub;
    it.classList.toggle('active', match && !it.id);
  });
  if (state.view === 'Security Tools') $('#toolsSubnav').classList.add('open');
}

// ---------------- routing ----------------
function setView(group, sub){
  state.view = group;
  state.sub = sub || null;
  state.search = '';
  $('#searchInput').value = '';
  refreshSidebarActive();
  render();
  clearInterval(state.procTimer); clearInterval(state.healthTimer);
  if (group === 'Process Manager') startProcPolling();
  if (group === 'Overview') startHealthPolling();
}

function render(){
  const main = $('#main');
  main.innerHTML = '';
  const view = el('div','view active');
  main.appendChild(view);

  if (state.search.trim()){
    renderSearchResults(view);
  } else if (state.view === 'Overview'){
    renderOverview(view);
  } else if (state.view === 'Process Manager'){
    renderProcessManager(view);
  } else if (state.view === 'Activity'){
    renderActivity(view);
  } else if (state.view === 'Help'){
    renderHelp(view);
  } else {
    renderToolGrid(view, state.view, state.sub);
  }
}

// ---------------- overview / health ----------------
async function fetchHealth(){
  try{
    const res = await fetch(state.base + '/health');
    const data = await res.json();
    setConn(true);
    return data;
  }catch(e){
    setConn(false);
    return null;
  }
}

function setConn(ok){
  $('#connDot').className = 'dot ' + (ok?'on':'off');
  $('#connText').textContent = ok ? ('online · ' + state.base.replace(/^https?:\/\//,'')) : 'offline — server not reachable';
}

async function renderOverview(view){
  view.appendChild(pageHead('Overview', 'Live status of the HexStrike AI engine — ' + ALL.length + ' endpoints wired up across ' + Object.keys(HEXDATA).length + ' categories.'));

  const statGrid = el('div','stat-grid');
  statGrid.id = 'ovStats';
  statGrid.innerHTML = skeletonStats();

function skeletonStats(){
  return ['Tools Available','Uptime','Essential Tools','Endpoints Wired'].map(l=>
    `<div class="stat-card"><div class="stat-val">—</div><div class="stat-label">${l}</div></div>`).join('');
}

async function refreshHealth(){
  const h = await fetchHealth();
  const sg = $('#ovStats');
  if (!sg) return;
  if (!h){
    sg.innerHTML = `<div class="stat-card"><div class="stat-val red">OFFLINE</div><div class="stat-label">Cannot reach ${esc(state.base)}</div></div>`;
    $('#catBars').innerHTML = `<div class="empty-state"><div class="big">⚠</div>Server unreachable. Start it with:<br><code style="color:var(--accent)">python3 hexstrike_server.py</code></div>`;
    $('#toolChips').innerHTML = '';
    return;
  }
  const uptimeH = (h.uptime/3600).toFixed(1);
  sg.innerHTML = `
    <div class="stat-card"><div class="stat-val accent">${h.total_tools_available}<span style="color:var(--text-2);font-size:15px">/${h.total_tools_count}</span></div><div class="stat-label">Tools Available</div></div>
    <div class="stat-card"><div class="stat-val">${uptimeH}h</div><div class="stat-label">Server Uptime</div></div>
    <div class="stat-card"><div class="stat-val ${h.all_essential_tools_available?'accent':'red'}">${h.all_essential_tools_available?'READY':'MISSING'}</div><div class="stat-label">Essential Tools</div></div>
    <div class="stat-card"><div class="stat-val">${ALL.length}</div><div class="stat-label">Endpoints Wired</div></div>
  `;

  const bars = $('#catBars');
  bars.innerHTML = '';
  const grid = el('div','cat-bars');
  for (const cat in h.category_stats){
    const c = h.category_stats[cat];
    const pct = c.total ? Math.round(100*c.available/c.total) : 0;
    const b = el('div','cat-bar');
    b.innerHTML = `<div class="cat-bar-top"><b>${(CAT_LABEL[cat]||cat).replace(/_/g,' ')}</b><span>${c.available}/${c.total}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
    grid.appendChild(b);
  }
  bars.appendChild(grid);

  const chipsWrap = $('#toolChips');
  chipsWrap.innerHTML = '';
  for (const cat in HEALTHCATS){
    const catBlock = el('div');
    catBlock.style.marginBottom = '14px';
    catBlock.innerHTML = `<div style="font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:7px">${(CAT_LABEL[cat]||cat).replace(/_/g,' ')}</div>`;
    const row = el('div','tool-chip-grid');
    HEALTHCATS[cat].forEach(tool=>{
      const ok = h.tools_status ? h.tools_status[tool] : false;
      const chip = el('span','tool-chip');
      chip.innerHTML = `<span class="dot ${ok?'on':'off'}" style="width:6px;height:6px"></span>${esc(tool)}`;
      row.appendChild(chip);
    });
    catBlock.appendChild(row);
    chipsWrap.appendChild(catBlock);
  }
}

function startHealthPolling(){
  state.healthTimer = setInterval(refreshHealth, 12000);
}

// ---------------- tool grid ----------------
function pageHead(title, sub, actionsHtml){
  const h = el('div','page-head');
  h.innerHTML = `<div><div class="page-title">${esc(title)}</div><div class="page-sub">${sub||''}</div></div><div class="page-actions">${actionsHtml||''}</div>`;
  return h;
}

function renderToolGrid(view, group, sub){
  const items = sub ? (HEXDATA[group][sub]||[]) : Object.values(HEXDATA[group]||{}).flat();
  const title = sub || group;
  view.appendChild(pageHead(title, `${items.length} endpoint${items.length===1?'':'s'}` + (sub?` in ${group}`:''), ));

  if (group === 'Security Tools' && !sub){
    const toolbar = el('div','toolbar');
    Object.keys(HEXDATA['Security Tools']).forEach(s=>{
      const chip = el('button','chip-filter', `${SUB_ICON[s]||''} ${s} (${HEXDATA['Security Tools'][s].length})`);
      chip.addEventListener('click', ()=> setView('Security Tools', s));
      toolbar.appendChild(chip);
    });
    view.appendChild(toolbar);
  }

  const grid = el('div','card-grid');
  items.forEach(r => grid.appendChild(toolCard(r, group, sub||r.sub)));
  view.appendChild(grid);
}

function toolCard(r, group, sub){
  const c = el('div','tool-card');
  c.setAttribute('role','button');
  c.setAttribute('tabindex','0');
  c.setAttribute('aria-label', 'Open ' + shortName(r.path));
  const method = r.methods[0];
  c.innerHTML = `
    <div class="tool-card-top">
      <span class="tool-name">${esc(shortName(r.path))}</span>
      <span class="method-badge ${method}">${method}</span>
    </div>
    <div class="tool-doc">${esc(r.doc||'No description available.')}</div>
    <div class="tool-card-foot">
      <span class="cat-tag">${esc(sub||group)}</span>
      <span class="param-count">${r.params.length} param${r.params.length===1?'':'s'}</span>
    </div>`;
  c.addEventListener('click', ()=> openDrawer(r));
  c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDrawer(r); } });
  return c;
}

function shortName(path){
  const parts = path.split('/').filter(Boolean);
  return parts[parts.length-1];
}

// ---------------- search ----------------
function renderSearchResults(view){
  const q = state.search.toLowerCase();
  const matches = ALL.filter(r =>
    r.path.toLowerCase().includes(q) ||
    (r.doc||'').toLowerCase().includes(q) ||
    r.group.toLowerCase().includes(q) ||
    (r.sub||'').toLowerCase().includes(q)
  );
  view.appendChild(pageHead('Search results', `${matches.length} match${matches.length===1?'':'es'} for "${esc(state.search)}"`));
  if (!matches.length){
    view.appendChild(el('div','empty-state','<div class="big">∅</div>No endpoints match your search.'));
    return;
  }
  const grid = el('div','card-grid');
  matches.forEach(r => grid.appendChild(toolCard(r, r.group, r.sub)));
  view.appendChild(grid);
}

// ---------------- process manager ----------------
async function renderProcessManager(view){
  view.appendChild(pageHead('Process Manager', 'Live view of everything HexStrike is currently running.'));
  const stats = el('div','stat-grid'); stats.id = 'procStats'; stats.innerHTML = skeletonStats();
  view.appendChild(stats);
  const panel = el('div','panel');
  panel.innerHTML = `<div class="panel-head"><h3>▣ Active processes</h3><span id="procUpdated" style="font-size:10.5px;color:var(--text-2);font-family:var(--mono)"></span></div><div class="panel-body" id="procBody"><div class="empty-state">Loading…</div></div>`;
  view.appendChild(panel);
  await refreshProcesses();
}

async function refreshProcesses(){
  const body = $('#procBody');
  if (!body) return;
  try{
    const res = await fetch(state.base + '/api/processes/dashboard');
    const d = await res.json();
    setConn(true);
    const sl = d.system_load || {};
    $('#procStats').innerHTML = `
      <div class="stat-card"><div class="stat-val accent">${d.total_processes ?? 0}</div><div class="stat-label">Active Processes</div></div>
      <div class="stat-card"><div class="stat-val">${(sl.cpu_percent??0).toFixed(1)}%</div><div class="stat-label">CPU Load</div></div>
      <div class="stat-card"><div class="stat-val">${(sl.memory_percent??0).toFixed(1)}%</div><div class="stat-label">Memory</div></div>
      <div class="stat-card"><div class="stat-val">${sl.active_connections ?? 0}</div><div class="stat-label">Connections</div></div>`;
    $('#procUpdated').textContent = 'updated ' + new Date().toLocaleTimeString();

    if (!d.processes || !d.processes.length){
      body.innerHTML = `<div class="empty-state"><div class="big">◌</div>Nothing running right now.<br>Kick off a scan from the Security Tools tab.</div>`;
      return;
    }
    const table = el('table','proc-table');
    table.innerHTML = `<thead><tr><th>PID</th><th>Command</th><th>Status</th><th>Progress</th><th>Runtime</th><th>ETA</th><th></th></tr></thead>`;
    const tbody = el('tbody');
    d.processes.forEach(p=>{
      const tr = el('tr');
      const st = (p.status||'running').toLowerCase();
      tr.innerHTML = `
        <td style="font-family:var(--mono);color:var(--text-2)">${p.pid}</td>
        <td class="proc-cmd" title="${esc(p.command)}">${esc(p.command)}</td>
        <td><span class="status-pill ${st}">${esc(p.status)}</span></td>
        <td><div class="mini-bar"><div class="fill" style="width:${esc(p.progress_percent||'0%')}"></div></div></td>
        <td style="font-family:var(--mono);color:var(--text-2)">${esc(p.runtime)}</td>
        <td style="font-family:var(--mono);color:var(--text-2)">${esc(p.eta)}</td>
        <td><div class="row-actions"></div></td>`;
      const actions = tr.querySelector('.row-actions');
      if (st === 'running' || st === 'paused'){
        const pauseBtn = el('button','icon-btn', st==='paused' ? '▶' : '⏸');
        pauseBtn.title = st==='paused' ? 'Resume' : 'Pause';
        pauseBtn.addEventListener('click', ()=> procAction(st==='paused'?'resume':'pause', p.pid));
        actions.appendChild(pauseBtn);
      }
      const stopBtn = el('button','icon-btn stop','⏹');
      stopBtn.title = 'Terminate';
      stopBtn.addEventListener('click', ()=> procAction('terminate', p.pid));
      actions.appendChild(stopBtn);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    body.innerHTML = '';
    body.appendChild(table);
  }catch(e){
    setConn(false);
    body.innerHTML = `<div class="empty-state"><div class="big">⚠</div>Cannot reach the server.</div>`;
  }
}

async function procAction(action, pid){
  try{
    await fetch(`${state.base}/api/processes/${action}/${pid}`, {method:'POST'});
    toast(`${action} sent to PID ${pid}`);
    refreshProcesses();
  }catch(e){
    toast(`Failed to ${action} PID ${pid}`, true);
  }
}

function startProcPolling(){
  state.procTimer = setInterval(refreshProcesses, 3000);
}

// ---------------- drawer / form / run ----------------
let currentRoute = null;

function openDrawer(r){
  currentRoute = r;
  $('#drawerTitle').textContent = `${r.methods[0]} ${r.path}`;
  $('#drawerDoc').textContent = r.doc || '';
  const body = $('#drawerBody');
  body.innerHTML = '';
  body.appendChild(el('div','endpoint-line', `<b>${r.methods[0]}</b> ${esc(state.base + r.path)}`));

  if (!r.params.length){
    body.appendChild(el('div','field','<span style="color:var(--text-2);font-size:12px">This endpoint takes no parameters — just hit Run.</span>'));
  }

  const globalTarget = $('#globalTarget').value.trim();
  const TARGET_NAMES = ['target','url','domain','ip','host'];

  r.params.forEach(p=>{
    const field = el('div','field');
    const isBool = typeof p.default === 'boolean';
    const isNum = typeof p.default === 'number';
    const isObj = typeof p.default === 'object' && p.default !== null;
    let prefill = p.default==null ? '' : (isObj ? JSON.stringify(p.default) : p.default);
    if (TARGET_NAMES.includes(p.name) && globalTarget) prefill = globalTarget;

    const labelHtml = `<label>${esc(p.name)}${p.required?' <span class="req">*</span>':''}${p.inpath?' <span class="hint">(in URL path)</span>':''}</label>`;

    if (isBool){
      field.innerHTML = labelHtml + `<div class="field-check"><label class="switch"><input type="checkbox" data-pname="${esc(p.name)}" data-ptype="bool" ${p.default?'checked':''}><span class="slider"></span></label><span style="color:var(--text-2);font-size:11.5px">${p.default? 'true':'false'} by default</span></div>`;
    } else if (isNum){
      field.innerHTML = labelHtml + `<input type="number" data-pname="${esc(p.name)}" data-ptype="num" value="${esc(prefill)}">`;
    } else if (isObj || String(prefill).length > 60){
      field.innerHTML = labelHtml + `<textarea data-pname="${esc(p.name)}" data-ptype="${isObj?'json':'str'}" placeholder="${isObj?'JSON value':'value'}">${esc(prefill)}</textarea>`;
    } else {
      field.innerHTML = labelHtml + `<input type="text" data-pname="${esc(p.name)}" data-ptype="str" value="${esc(prefill)}" placeholder="${p.required?'required':'optional'}">`;
    }
    body.appendChild(field);
  });

  const outWrap = el('div'); outWrap.id = 'drawerOutput';
  body.appendChild(outWrap);

  $('#runStatus').textContent = '';
  $('#overlay').classList.add('open');
  $('#drawer').classList.add('open');
}

function closeDrawer(){
  $('#overlay').classList.remove('open');
  $('#drawer').classList.remove('open');
}

function collectFormValues(){
  const values = {};
  document.querySelectorAll('#drawerBody [data-pname]').forEach(elm=>{
    const name = elm.dataset.pname;
    const type = elm.dataset.ptype;
    if (type === 'bool'){ values[name] = elm.checked; return; }
    if (type === 'num'){ values[name] = elm.value === '' ? null : Number(elm.value); return; }
    if (type === 'json'){
      try{ values[name] = elm.value.trim() ? JSON.parse(elm.value) : null; }
      catch(e){ values[name] = elm.value; }
      return;
    }
    values[name] = elm.value;
  });
  return values;
}

function buildRequest(){
  const r = currentRoute;
  const values = collectFormValues();
  let path = r.path;
  const method = r.methods[0];
  const bodyParams = {};
  const queryParts = [];
  r.params.forEach(p=>{
    const v = values[p.name];
    if (p.inpath){
      path = path.replace(new RegExp('<[^>]*'+p.name+'>'), encodeURIComponent(v));
    } else if (method === 'GET' && p.source === 'query'){
      if (v !== '' && v != null) queryParts.push(`${encodeURIComponent(p.name)}=${encodeURIComponent(v)}`);
    } else {
      bodyParams[p.name] = v;
    }
  });
  let url = state.base + path;
  if (queryParts.length) url += '?' + queryParts.join('&');
  const hasBody = method !== 'GET' && r.params.some(p=>!p.inpath && !(method==='GET'&&p.source==='query'));
  return {url, method, body: hasBody ? bodyParams : null};
}

async function runCurrent(){
  const {url, method, body} = buildRequest();
  const runBtn = $('#runBtn');
  runBtn.disabled = true;
  runBtn.innerHTML = '<span class="spin"></span> Running…';
  $('#runStatus').textContent = method + ' ' + url.replace(state.base,'');
  const outWrap = $('#drawerOutput');
  outWrap.innerHTML = '';
  const startedAt = Date.now();

  try{
    const opts = {method, headers:{}};
    if (body){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(url, opts);
    const ms = Date.now()-startedAt;
    let data;
    const text = await res.text();
    try{ data = JSON.parse(text); }catch(e){ data = text; }
    setConn(true);

    const box = el('div','output-box');
    const ok = res.ok;
    box.innerHTML = `<div class="output-head"><span>${ok?'✓ '+res.status:'✗ '+res.status} · ${ms}ms</span></div>`;
    const pre = el('pre','output-pre'+(ok?'':' err'), esc(typeof data==='string'?data:JSON.stringify(data,null,2)));
    box.appendChild(pre);
    outWrap.appendChild(box);

    pushHistory({
      path: currentRoute.path, method, ok,
      time: new Date().toLocaleTimeString(),
      summary: ok ? `${ms}ms · ${res.status}` : (data && data.error ? String(data.error).slice(0,120) : `HTTP ${res.status}`)
    });
    toast(ok ? `${shortName(currentRoute.path)} completed` : `${shortName(currentRoute.path)} failed (${res.status})`, !ok);
  }catch(e){
    setConn(false);
    const box = el('div','output-box');
    box.innerHTML = `<div class="output-head"><span>✗ network error</span></div>`;
    box.appendChild(el('pre','output-pre err', esc(String(e))));
    outWrap.appendChild(box);
    pushHistory({path: currentRoute.path, method, ok:false, time:new Date().toLocaleTimeString(), summary:'Network error — is the server running?'});
    toast('Network error — server unreachable', true);
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = '▶ Run';
  }
}

function copyCurl(){
  const {url, method, body} = buildRequest();
  let cmd = `curl -sS -X ${method} '${url}'`;
  if (body) cmd += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(body).replace(/'/g,"'\\''")}'`;
  navigator.clipboard.writeText(cmd).then(()=> toast('curl command copied')).catch(()=> toast('Copy failed', true));
}

// ---------------- init ----------------
function init(){
  buildSidebar();
  refreshSidebarActive();
  setView('Overview', null);

  $('#searchInput').addEventListener('input', e=>{
    state.search = e.target.value;
    render();
  });
  document.addEventListener('keydown', e=>{
    if (e.key === '/' && document.activeElement !== $('#searchInput')){
      e.preventDefault(); $('#searchInput').focus();
    }
    if (e.key === 'Escape') closeDrawer();
  });
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#overlay').addEventListener('click', closeDrawer);
  $('#runBtn').addEventListener('click', runCurrent);
  $('#copyCurlBtn').addEventListener('click', copyCurl);
  $('#connBadge').addEventListener('click', ()=> state.view==='Process Manager' ? refreshProcesses() : refreshHealth());
  $('#globalTarget').value = localStorage.getItem('hx_target') || '';
  $('#globalTarget').addEventListener('change', e=> localStorage.setItem('hx_target', e.target.value));

  fetchHealth().then(h=> setConn(!!h));
}

document.addEventListener('DOMContentLoaded', init);
})();

</script>
